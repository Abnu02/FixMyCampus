<div class="admin-shell">
  <!-- Top Navigation Bar -->
  <header class="navbar">
    <div class="nav-left">
      <button type="button" class="menu-toggle-btn" (click)="toggleSidebar(); toggleMobileSidebar()" aria-label="Toggle navigation">
        <svg class="menu-icon" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M3 18h18v-2H3v2zm0-5h18v-2H3v2zm0-7v2h18V6H3z"/></svg>
      </button>
      
      <div class="brand">
        <div class="brand-logo">
          <svg viewBox="0 0 24 24" class="logo-icon"><path fill="currentColor" d="M20 2H4c-1.1 0-2 .9-2 2v18l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2z"/></svg>
        </div>
        <div class="brand-text">
          <div class="brand-title">
            FixMyCampus <span class="badge-portal">Admin Portal</span>
          </div>
        </div>
      </div>
    </div>

    <div class="nav-right">
      <div class="user-profile-wrapper">
        <button class="profile-trigger" (click)="toggleProfileMenu()">
          <div class="avatar">
            <svg viewBox="0 0 24 24" class="avatar-icon"><path fill="currentColor" d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
          </div>
          <div class="user-info">
            <span class="user-name">{{ adminUser.name }}</span>
            <span class="user-email">{{ adminUser.email }}</span>
          </div>
          <svg class="chevron-icon" viewBox="0 0 24 24"><path fill="currentColor" d="M7.41 8.59L12 13.17l4.59-4.58L18 10l-6 6-6-6 1.41-1.41z"/></svg>
        </button>

        <div class="dropdown-menu" *ngIf="isProfileMenuOpen">
          <div class="dropdown-header">
            <strong>{{ adminUser.name }}</strong>
            <small>{{ adminUser.email }}</small>
          </div>
          <hr />
          <button class="dropdown-item logout-btn" (click)="logout()">
            Logout
          </button>
        </div>
      </div>
    </div>
  </header>

  <div class="admin-body">
    <!-- Collapsible Sidebar -->
    <aside class="sidebar" [class.collapsed]="isSidebarCollapsed" [class.mobile-open]="isMobileOpen">
      <nav class="sidebar-nav">
        <a routerLink="/admin/dashboard" routerLinkActive="active" class="nav-item">
          <svg class="nav-icon" viewBox="0 0 24 24"><path fill="currentColor" d="M3 13h8V3H3v10zm0 8h8v-6H3v6zm10 0h8V11h-8v10zm0-18v6h8V3h-8z"/></svg>
          <span class="nav-label">Dashboard</span>
        </a>

        <a routerLink="/admin/tickets" routerLinkActive="active" class="nav-item">
          <svg class="nav-icon" viewBox="0 0 24 24"><path fill="currentColor" d="M22 10V6c0-1.11-.9-2-2-2H4c-1.1 0-1.99.89-1.99 2v4c1.1 0 1.99.9 1.99 2s-.89 2-2 2v4c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2v-4c-1.1 0-2-.9-2-2s.9-2 2-2zm-2-1.5c-1.25.75-2 2.07-2 3.5s.75 2.75 2 3.5V18H4v-2.5c1.25-.75 2-2.07 2-3.5s-.75-2.75-2-3.5V6h16v2.5z"/></svg>
          <span class="nav-label">Tickets</span>
        </a>

        <a routerLink="/admin/ticket-history" routerLinkActive="active" class="nav-item">
          <svg class="nav-icon" viewBox="0 0 24 24"><path fill="currentColor" d="M13 3c-4.97 0-9 4.03-9 9H1l3.89 3.89.07.14L9 12H6c0-3.87 3.13-7 7-7s7 3.13 7 7-3.13 7-7 7c-1.93 0-3.68-.79-4.94-2.06l-1.42 1.42C8.27 19.99 10.51 21 13 21c4.97 0 9-4.03 9-9s-4.03-9-9-9zm-1 5v5l4.28 2.54.72-1.21-3.5-2.08V8H12z"/></svg>
          <span class="nav-label">Ticket History</span>
          <span class="badge-text">Audit</span>
        </a>

        <div class="nav-section-title">HIERARCHY & FACILITIES</div>

        <a routerLink="/admin/campus" routerLinkActive="active" class="nav-item">
          <svg class="nav-icon" viewBox="0 0 24 24"><path fill="currentColor" d="M12 7V3H2v18h20V7H12zM6 19H4v-2h2v2zm0-4H4v-2h2v2zm0-4H4V9h2v2zm0-4H4V5h2v2zm4 12H8v-2h2v2zm0-4H8v-2h2v2zm0-4H8V9h2v2zm0-4H8V5h2v2zm10 12h-8v-2h2v-2h-2v-2h2v-2h-2V9h8v10zm-2-8h-2v2h2v-2zm0 4h-2v2h2v-2z"/></svg>
          <span class="nav-label">Campus Management</span>
        </a>
      </nav>
    </aside>

    <!-- Main Content Area -->
    <main class="main-content">
      <router-outlet></router-outlet>
    </main>
  </div>
</div>
